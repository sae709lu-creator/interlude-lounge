<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中繼休息大廳｜The Interlude Lounge</title>
<meta name="description" content="RP 角色與世界觀作品的互動展示入口。">
<style>
/* =========================================================
   設計代幣
   ========================================================= */
:root{
  /* 奇幻旅店色盤 */
  --forest:#243D35; --moss:#496451; --walnut:#39271F; --oak:#81583A;
  --brass:#B38A4C; --amber:#F0BE75; --wine:#713E49; --stone:#827A6C;
  --parch:#E7D7B7; --shadow:#171E1B;
  --gold:#B38A4C; --gold-hi:#F0BE75; --gold-lo:#7A5A2E;
  --mist:#5FC4B0; --mist-hi:#B5F2E2; --rune:#5FC4B0; --focus:#8FE3D0;
  --cream:#E7D7B7; --muted:#AFA48C; --ink:#111613;
  --panel-2:#2E2119;
  --page:#141A17; --page-edge:#0B0F0D;
  --f-body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-title:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU","MingLiU",serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#121714; --page-edge:#090C0A; }
}
:root[data-theme="dark"]{ --page:#121714; --page-edge:#090C0A; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%;
  background:var(--page);
  background-image:radial-gradient(ellipse at 50% 34%, rgba(240,190,117,.06), transparent 46%), radial-gradient(ellipse at 50% 40%, transparent 40%, var(--page-edge) 100%);
  color:var(--cream); font-family:var(--f-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
body.modal-open{ overflow:hidden; }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
button{ font:inherit; color:inherit; }

/* =========================================================
   頁首
   ========================================================= */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  max-width:1320px; margin:0 auto; padding:14px clamp(16px,3vw,32px) 12px;
}
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand svg{ width:32px; height:40px; flex:none; }
.brand h1{
  margin:0; font-family:var(--f-title); font-weight:700;
  font-size:clamp(1.25rem,2.2vw,1.625rem); line-height:1.2; letter-spacing:.12em; color:var(--cream);
}
.brand p{ margin:2px 0 0; font-size:.8125rem; color:var(--gold-hi); letter-spacing:.04em; }
.brand .brand-tag{ margin:0; font-family:var(--f-title); font-size:.75rem; color:var(--muted); letter-spacing:.16em; }
@media (max-width: 480px){ .brand .brand-tag{ display:none; } }

/* =========================================================
   像素按鈕
   ========================================================= */
.btn{
  --bd:var(--gold-lo);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:8px 18px;
  background:var(--panel-2); color:var(--cream); border:0; cursor:pointer;
  font-size:.9375rem; line-height:1.3; text-decoration:none; white-space:nowrap;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  box-shadow:inset 0 0 0 2px var(--bd), inset 0 -6px 0 rgba(0,0,0,.28);
}
.btn:hover{ background:#3A2A1F; }
.btn:active{ box-shadow:inset 0 0 0 2px var(--bd), inset 0 4px 0 rgba(0,0,0,.28); }
.btn:focus-visible{ outline:none; box-shadow:inset 0 0 0 3px var(--focus), inset 0 -6px 0 rgba(0,0,0,.28); }
.btn-primary{ background:var(--gold-hi); color:#2A1A10; --bd:#FFE2AC; font-weight:700; }
.btn-primary:hover{ background:#FFD08A; }
.btn-primary[disabled]{ opacity:.6; cursor:progress; }
.btn-pending{ background:transparent; color:var(--muted); --bd:#4E4840; cursor:not-allowed; }
.btn-pending:hover{ background:transparent; }
.btn-ghost{ background:transparent; --bd:transparent; padding-left:10px; padding-right:12px; color:var(--gold-hi); }
.btn-ghost:hover{ background:rgba(255,255,255,.06); }
.btn-quick .btn-icon{ width:16px; height:16px; }

/* =========================================================
   大廳場景
   ========================================================= */
main{ padding:0 clamp(8px,2vw,24px) 20px; }
.stage-scroll{
  max-width:1320px; margin:0 auto; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:thin; scrollbar-color:#5C4030 transparent; overscroll-behavior-x:contain;
  padding:12px;
}
.stage{
  position:relative; margin:0 auto;
  width:min(100%, 1280px, calc((100svh - 184px) * 1.6));
  min-width:min(100%, 560px);
  aspect-ratio:960 / 600;
  background:var(--ink);
  box-shadow:0 0 0 2px var(--ink), 0 0 0 6px var(--walnut), 0 0 0 8px var(--brass), 0 0 0 10px #5C4030, 0 0 0 12px var(--ink), 0 18px 40px rgba(0,0,0,.5);
}
.stage > svg{ display:block; width:100%; height:100%; }
.hint{
  max-width:1320px; margin:18px auto 0; text-align:center;
  font-size:.875rem; color:var(--muted); padding:0 16px;
}
.hint kbd{
  font-family:var(--f-body); font-size:.8125rem; padding:0 6px;
  background:var(--panel-2); color:var(--cream); box-shadow:inset 0 -2px 0 rgba(0,0,0,.4);
}

@media (max-width: 760px){
  .stage{ width:clamp(820px, calc((100svh - 190px) * 1.6), 1040px); min-width:820px; }
  .stage-scroll{ padding:6px 12px 10px; }
  .hint .desk-only{ display:none; }
}
/* 手機橫向：縮小頁首、隱藏提示，讓整個大廳一次放進畫面 */
@media (max-height: 500px) and (orientation: landscape){
  .topbar{ padding:6px max(16px, env(safe-area-inset-right,0px)) 4px max(16px, env(safe-area-inset-left,0px)); }
  .brand{ gap:8px; }
  .brand svg{ width:20px; height:25px; }
  .brand h1{ font-size:1rem; }
  .brand p{ display:none; }
  .btn-quick{ min-height:40px; padding:4px 14px; font-size:.875rem; }
  main{ padding:0 max(8px, env(safe-area-inset-right,0px)) 8px max(8px, env(safe-area-inset-left,0px)); }
  .stage-scroll{ padding:4px 6px; }
  .stage{ width:min(100%, calc((100svh - 70px) * 1.6)); min-width:0; }
  .hint{ display:none; }
}
@media (min-width: 761px){ .hint .touch-only{ display:none; } }

/* 互動物件 */
.hot{ cursor:pointer; outline:none; --hl:var(--gold-hi); }
.hot .hit{ pointer-events:all; }
.hot:hover .art{
  filter:drop-shadow(2px 0 0 var(--hl)) drop-shadow(-2px 0 0 var(--hl)) drop-shadow(0 2px 0 var(--hl)) drop-shadow(0 -2px 0 var(--hl));
}
.hot:focus-visible .art{
  --hl:var(--focus);
  filter:drop-shadow(3px 0 0 var(--hl)) drop-shadow(-3px 0 0 var(--hl)) drop-shadow(0 3px 0 var(--hl)) drop-shadow(0 -3px 0 var(--hl)) brightness(1.1);
}
.hot.tap .art{ animation:tap .36s steps(2) 1; }
@keyframes tap{ 0%{ filter:brightness(1.7); } 100%{ filter:brightness(1); } }
.lights{ pointer-events:none; }
.cat{ cursor:pointer; outline:none; --hl:var(--gold-hi); }
.cat .cat-hit{ pointer-events:all; }
.cat:hover{ filter:drop-shadow(2px 0 0 var(--hl)) drop-shadow(-2px 0 0 var(--hl)) drop-shadow(0 2px 0 var(--hl)) drop-shadow(0 -2px 0 var(--hl)); }
.cat:focus-visible{ --hl:var(--focus); filter:drop-shadow(3px 0 0 var(--hl)) drop-shadow(-3px 0 0 var(--hl)) drop-shadow(0 3px 0 var(--hl)) drop-shadow(0 -3px 0 var(--hl)); }
.cat.poke .cat-head{ animation:hop .5s steps(2) 1; }
@keyframes hop{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }

/* 名稱提示 */
.tip{
  position:absolute; left:0; top:0; z-index:2; pointer-events:none;
  transform:translate(-50%, calc(-100% - 6px));
  display:flex; align-items:baseline; gap:8px;
  padding:6px 12px; background:#2A1E16; color:var(--cream);
  font-size:.875rem; line-height:1.3; white-space:nowrap;
  box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--brass), 0 0 0 6px var(--ink), 4px 6px 0 4px rgba(0,0,0,.4);
  opacity:0; transition:opacity .12s;
}
.tip.inside{ transform:translate(-50%, 8px); }
.tip.show{ opacity:1; }
.tip strong{ color:var(--gold-hi); font-weight:700; font-family:var(--f-title); letter-spacing:.06em; }
.tip span{ color:var(--muted); font-size:.8125rem; }

/* 貓咪的對話泡泡 */
.cat-bubble{
  position:absolute; left:90.5%; top:85%; z-index:2; pointer-events:none;
  transform:translate(-88%, calc(-100% - 8px));
  padding:6px 12px; background:var(--parch); color:#2B2119;
  font-size:.875rem; line-height:1.35; white-space:nowrap;
  box-shadow:0 0 0 2px var(--ink), 4px 4px 0 2px rgba(0,0,0,.35);
  opacity:0; transition:opacity .15s;
}
.cat-bubble::after{
  content:""; position:absolute; right:10%; bottom:-8px; width:8px; height:8px;
  background:var(--parch); box-shadow:2px 2px 0 0 var(--ink);
  clip-path:polygon(0 0,100% 0,100% 100%);
}
.cat-bubble.show{ opacity:1; }

/* 場景微動態：壁爐火焰、燭火、晶石、門縫微光、貓尾巴 */
.fire-a{ animation:fireA .9s steps(1) infinite; }
.fire-b{ animation:fireB .9s steps(1) infinite; }
@keyframes fireA{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes fireB{ 0%,49%{opacity:0} 50%,100%{opacity:1} }
.fire-glow{ animation:hearth 2.8s ease-in-out infinite alternate; }
@keyframes hearth{ 0%{opacity:.8} 40%{opacity:1} 70%{opacity:.88} 100%{opacity:.96} }
.flick{ animation:flick 3.4s steps(1) infinite; }
.flick.f2{ animation-delay:-1.7s; }
@keyframes flick{ 0%,72%,100%{opacity:1} 74%{opacity:.7} 78%{opacity:1} 84%{opacity:.82} }
.lamp-glow{ animation:lamp 5s ease-in-out infinite alternate; }
@keyframes lamp{ from{opacity:.82} to{opacity:1} }
.seam-glow{ animation:seam 3.6s ease-in-out infinite alternate; }
@keyframes seam{ from{opacity:.6} to{opacity:1} }
.crystal-glow, .holo{ animation:breathe 4.2s ease-in-out infinite alternate; }
.rune-glow{ animation:breathe 6s ease-in-out infinite alternate; }
@keyframes breathe{ from{opacity:.55} to{opacity:1} }
.cat-tail{ transform-box:fill-box; transform-origin:0% 100%; animation:tail 6s steps(1) infinite; }
@keyframes tail{ 0%,78%,100%{transform:rotate(0)} 80%{transform:rotate(-10deg)} 84%{transform:rotate(4deg)} 88%{transform:rotate(-7deg)} 92%{transform:rotate(0)} }

/* =========================================================
   視窗面板
   ========================================================= */
.overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top,0px)) 24px max(24px, env(safe-area-inset-bottom,0px));
  background:rgba(9,12,10,.76);
}
.overlay[hidden]{ display:none; }
.modal{
  --frame:#39271F; --frame-hi:#B38A4C; --accent:#F0BE75; --bg:#1B2723; --row:#24332E; --plate:var(--frame-hi);
  position:relative; display:flex; flex-direction:column;
  width:min(940px, 100%); max-height:min(780px, 100%);
  padding:8px; color:var(--cream);
  background:
    linear-gradient(var(--plate),var(--plate)) left 10px top 10px / 6px 6px no-repeat,
    linear-gradient(var(--plate),var(--plate)) right 10px top 10px / 6px 6px no-repeat,
    linear-gradient(var(--plate),var(--plate)) left 10px bottom 10px / 6px 6px no-repeat,
    linear-gradient(var(--plate),var(--plate)) right 10px bottom 10px / 6px 6px no-repeat,
    var(--bg);
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset 0 0 0 4px var(--frame), inset 0 0 0 6px var(--frame-hi), inset 0 0 0 8px var(--ink), inset 0 0 0 9px rgba(231,215,183,.07);
  animation:modal-in .16s steps(3) 1;
}
@keyframes modal-in{ from{ transform:scale(.97); opacity:.4; } to{ transform:none; opacity:1; } }
/* 各設施的面板外觀：接待台（預設）、藏書櫃、告示板、壁爐、觀測台、層界之門、命運抽取機 */
.modal[data-skin="wood"]  { --frame:#39271F; --frame-hi:#B38A4C; --accent:#F0BE75; --bg:#1E1813; --row:#2A2019; }
.modal[data-skin="paper"] { --frame:#6A4630; --frame-hi:#CFA762; --accent:#E8C985; --bg:#221A14; --row:#2E241C; }
.modal[data-skin="lounge"]{ --frame:#4E2731; --frame-hi:#B38A4C; --accent:#F0BE75; --bg:#21171A; --row:#2D2024; --plate:#A2646F; }
.modal[data-skin="screen"]{ --frame:#24332E; --frame-hi:#5FC4B0; --accent:#B5F2E2; --bg:#10201D; --row:#16302B; --plate:#B38A4C; }
.modal[data-skin="lift"]  { --frame:#4E4840; --frame-hi:#9A9283; --accent:#8FE3D0; --bg:#171C1A; --row:#222926; --plate:#5FC4B0; }
.modal[data-skin="post"]  { --frame:#4A3326; --frame-hi:#CFA762; --accent:#F0BE75; --bg:#1C2420; --row:#26302B; --plate:#5FC4B0; }
.modal[data-skin="gacha"] { --frame:#7A5A2E; --frame-hi:#E8C985; --accent:#F0BE75; --bg:#1F1A13; --row:#2B2419; --plate:#713E49; }
.modal[data-skin="screen"] .modal-body{
  background-image:radial-gradient(rgba(181,242,226,.10) 1px, transparent 1.5px), radial-gradient(rgba(181,242,226,.06) 1px, transparent 1.5px);
  background-size:46px 46px, 28px 28px; background-position:0 0, 13px 19px;
}

.modal-head{
  display:flex; align-items:flex-start; gap:12px;
  position:relative;
  padding:18px 14px 14px 26px;
  border-bottom:2px solid rgba(0,0,0,.4);
  box-shadow:0 2px 0 rgba(179,138,76,.28);
}
.modal-head::after{
  content:""; position:absolute; left:50%; bottom:-6px; width:10px; height:10px; margin-left:-5px;
  background:var(--frame-hi); transform:rotate(45deg); box-shadow:0 0 0 2px var(--bg);
}
.modal-head-text{ min-width:0; padding-top:4px; }
.modal-head h2{
  margin:0; font-family:var(--f-title); font-weight:700;
  font-size:clamp(1.25rem, 2.4vw, 1.5rem); line-height:1.3; letter-spacing:.08em; color:var(--parch);
}
.modal-head h2:focus{ outline:none; }
.modal-head p{ margin:2px 0 0; font-size:.875rem; color:var(--accent); }
.modal-close{
  margin-left:auto; flex:none; width:44px; height:44px; padding:0;
  display:grid; place-items:center;
}
.modal-close svg{ width:14px; height:14px; }
.modal-body{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:20px 22px 28px;
  scrollbar-width:thin; scrollbar-color:rgba(179,138,76,.45) transparent;
}
.modal-body h3{ font-family:var(--f-title); letter-spacing:.04em; }
.modal-body [data-focus]:focus{ outline:none; }

@media (max-width: 640px), (max-height: 500px){
  .overlay{ padding:0; }
  .modal{
    width:100%; height:100%; max-height:none;
    clip-path:none; animation:none;
    padding-top:calc(8px + env(safe-area-inset-top,0px));
    padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  }
  .modal-head{ padding:12px 8px 12px 16px; position:sticky; top:0; }
  .modal-body{ padding:16px 16px 28px; }
}

/* ---------- 共用元件 ---------- */
.lead{ font-size:1.0625rem; max-width:38em; margin:0 0 20px; }
.section-title{ font-size:1.0625rem; margin:24px 0 10px; color:var(--accent); }
.status{ margin:12px 0 10px; font-size:.875rem; color:var(--muted); min-height:1.4em; }
.empty{
  grid-column:1 / -1;
  padding:32px 20px; text-align:center; color:var(--muted);
  border:2px dashed rgba(179,138,76,.32); background:rgba(0,0,0,.14);
}
.empty p{ margin:0 0 14px; }
.empty p:last-child{ margin-bottom:0; }
.demo-badge{
  display:inline-block; font-size:.75rem; line-height:1.4; padding:1px 8px;
  background:rgba(179,138,76,.18); color:var(--gold-hi); box-shadow:inset 0 0 0 1px rgba(179,138,76,.5);
}
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

.cover{ position:relative; aspect-ratio:3 / 4; background:#0F1311; overflow:hidden; }
.cover img, .cover svg, .cover video{ display:block; width:100%; height:100%; object-fit:cover; }
.cover .badges{ position:absolute; left:6px; top:6px; display:flex; gap:4px; }
.cover .badges .demo-badge{ background:rgba(14,19,27,.85); }
.cover .badges .badge-18{ background:rgba(113,62,73,.94); color:#FBE6E3; box-shadow:inset 0 0 0 1px rgba(162,100,111,.8); font-weight:700; }

/* ---------- 設施列表 ---------- */
.fac-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(min(260px,100%), 1fr)); }
.fac-btn{
  width:100%; display:grid; grid-template-columns:40px 1fr; gap:14px; align-items:center;
  min-height:60px; padding:10px 14px; text-align:left; cursor:pointer;
  background:var(--row); border:0; box-shadow:inset 4px 0 0 var(--c, var(--gold));
}
.fac-btn:hover{ background:rgba(255,255,255,.07); }
.fac-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px; }
.fac-btn svg{ width:40px; height:40px; }
.fac-btn strong{ display:block; font-size:1rem; line-height:1.35; }
.fac-btn span{ display:block; font-size:.8125rem; color:var(--muted); line-height:1.4; }
.howto{ margin:0; padding-left:1.2em; max-width:40em; }
.howto li{ margin:4px 0; }
.howto li::marker{ color:var(--gold); }

/* ---------- 角色圖庫 ---------- */
.toolbar{ display:flex; flex-direction:column; gap:12px; }
.search{
  width:100%; min-height:44px; padding:10px 14px;
  font:inherit; color:var(--cream); background:#120E0B; border:0;
  box-shadow:inset 0 0 0 2px #5C4030, inset 0 0 0 4px #1A130F, inset 0 4px 0 rgba(0,0,0,.4);
}
.search::placeholder{ color:#8E8370; }
.search:focus{ outline:none; box-shadow:inset 0 0 0 2px var(--gold-hi), inset 0 0 0 4px #1A130F, inset 0 4px 0 rgba(0,0,0,.4); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:40px; padding:6px 14px; cursor:pointer; font-size:.875rem;
  background:var(--row); border:0; box-shadow:inset 0 0 0 2px rgba(179,138,76,.5);
  clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
}
.chip:hover{ background:rgba(255,255,255,.07); }
.chip[aria-pressed="true"]{ background:var(--brass); color:#21170F; box-shadow:inset 0 0 0 2px #E8C985, inset 0 -3px 0 var(--gold-lo); font-weight:700; }
.chip:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px; }
.grid{
  display:grid; gap:18px 16px;
  grid-template-columns:repeat(auto-fill, minmax(min(150px, calc(50% - 8px)), 1fr));
}
.card{
  display:flex; flex-direction:column; gap:4px; padding:0; text-align:left; cursor:pointer;
  background:none; border:0;
}
.card .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px #5C4030, 0 0 0 6px var(--ink); margin:2px 2px 8px; }
.card:hover .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--gold-hi), 0 0 0 6px var(--ink); }
.card:focus-visible{ outline:none; }
.card:focus-visible .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 5px var(--focus), 0 0 0 7px var(--ink); }
.card-title{ font-weight:700; font-size:.9375rem; line-height:1.4; color:var(--parch); }
.card-meta{ font-size:.75rem; color:var(--muted); line-height:1.4; }

/* ---------- 作品詳細 ---------- */
.back{ margin:-6px 0 14px -6px; }
.detail{ display:grid; grid-template-columns:minmax(0, 260px) 1fr; gap:28px; align-items:start; }

.taglist{ display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0; }
.tag{ font-size:.8125rem; padding:1px 8px; background:rgba(231,215,183,.08); box-shadow:inset 0 0 0 1px rgba(179,138,76,.28); }
.tag-btn{ border:0; cursor:pointer; min-height:32px; padding:4px 10px; color:var(--cream); }
.tag-btn:hover{ background:rgba(179,138,76,.26); }
.tag-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
.desc, .feature p, .gacha-card p, .term-detail .summary{ white-space:pre-line; }

.feature-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }

  content:""; position:absolute; top:-6px; left:calc(50% - 7px); width:14px; height:14px;

.note-link{

/* ---------- 精選推薦 ---------- */

.features{ display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(380px,100%),1fr)); }
.feature{

}

.feature p{ margin:0; font-size:.9375rem; }
.feature .actions{ margin-top:12px; }

/* ---------- 終端機 ---------- */
.term-path{ margin:0 0 14px; font-family:var(--f-mono); font-size:.8125rem; color:var(--mist); }
.term-path::before{ content:"✦ "; color:var(--gold-hi); }
.term{ display:grid; grid-template-columns:250px 1fr; gap:20px; align-items:start; }
.term-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.term-item{
  width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px;
  min-height:48px; padding:10px 14px; text-align:left; cursor:pointer;
  background:transparent; border:0;
}
.term-item:hover{ background:rgba(95,196,176,.1); }
.term-item[aria-current="true"]{ background:rgba(95,196,176,.18); box-shadow:inset 4px 0 0 var(--mist), inset 0 0 0 1px rgba(95,196,176,.3); }
.term-item:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px; }
.term-name{ font-weight:700; }
.term-count{ font-size:.8125rem; color:var(--mist-hi); white-space:nowrap; }
.term-detail{ padding:18px 20px; background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 2px #2F4A44, inset 0 0 0 4px rgba(0,0,0,.3), inset 0 0 0 5px rgba(179,138,76,.35); min-width:0; }
.term-detail h3{ margin:0; font-size:1.375rem; }
.term-detail .tagline{ margin:4px 0 12px; color:var(--mist-hi); }
.term-detail .summary{ margin:0; max-width:36em; }
.term-stat{ margin:14px 0 0; font-family:var(--f-mono); font-size:.8125rem; color:var(--mist); }

.work-list{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.work-row{
  width:100%; display:grid; grid-template-columns:48px 1fr auto; gap:14px; align-items:center;
  min-height:44px; padding:8px 12px 8px 8px; text-align:left; cursor:pointer;
  background:rgba(231,215,183,.04); border:0; box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);
}
.work-row:hover{ background:rgba(231,215,183,.09); }
.work-row:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px; }
.work-row .cover{ width:48px; }
.work-row .cover .badges{ display:none; }
.work-row strong{ display:block; font-size:.9375rem; line-height:1.4; }
.work-row small{ display:block; font-size:.75rem; color:var(--muted); line-height:1.4; }
.work-row .go{ font-size:.8125rem; color:var(--accent); }

/* ---------- 電梯 ---------- */
.lift-display{
  display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:12px 18px;
  background:#0F1412; box-shadow:inset 0 0 0 2px #4E4840, inset 0 0 0 4px #0F1412, inset 0 0 0 5px rgba(95,196,176,.35);
}
.lift-floor{
  min-width:2.6em; font-family:var(--f-mono); font-size:1.75rem; font-weight:700; line-height:1;
  color:var(--mist-hi); text-shadow:0 0 8px rgba(95,196,176,.6); font-family:var(--f-title);

.lift-name{ font-size:1.0625rem; }
.lift-buttons{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(min(190px,100%),1fr)); }
.lift-btn{

.lift-btn:focus-visible{ outline:3px solid var(--focus); outline-offset:-3px; }

.lift-btn[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--rune); }
.lift-btn .cnt{ margin-left:auto; font-size:.8125rem; color:var(--muted); }
.lift-results{ margin-top:22px; scroll-margin-top:12px; }
.lift-results > .status{ margin:0 0 4px; color:var(--accent); }
@media (max-width: 640px){

  .lift-name{ font-size:.9375rem; }

    display:grid; grid-template-columns:30px minmax(0,1fr); column-gap:8px; align-items:center;
    min-height:44px; padding:4px 8px 4px 4px; font-size:.875rem; line-height:1.25;
  }
  .lift-btn .num{ grid-row:1 / 3; width:30px; height:30px; font-size:.75rem; }
  .lift-btn > span:nth-child(2){ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lift-btn .cnt{ margin-left:0; font-size:.6875rem; line-height:1.2; }
  .lift-results{ margin-top:16px; }
}

/* ---------- 扭蛋機 ---------- */
.gacha{ display:grid; grid-template-columns:210px 1fr; gap:28px; align-items:start; }
.gacha-machine{ display:flex; flex-direction:column; align-items:center; gap:16px; }
.capsule-stage{
  width:180px; height:180px; display:grid; place-items:center;
  background:radial-gradient(circle at 50% 46%, rgba(240,190,117,.12), transparent 62%), #14110C;
  box-shadow:inset 0 0 0 2px #7A5A2E, inset 0 0 0 4px #14110C, inset 0 0 0 5px rgba(232,201,133,.4), inset 0 -24px 0 rgba(255,255,255,.03);
}
.capsule svg{ display:block; width:104px; height:104px; overflow:visible; }
.capsule .cap-top{ transform-box:fill-box; transform-origin:0% 100%; transition:transform .24s steps(3); }
.capsule.open .cap-top{ transform:translate(-2px,-4px) rotate(-16deg); }
.capsule.rolling{ animation:roll .5s steps(4) 1; }
@keyframes roll{
  0%{ transform:translateY(-28px) rotate(0deg); }
  25%{ transform:translateY(0) rotate(90deg); }
  50%{ transform:translateY(-10px) rotate(180deg); }
  75%{ transform:translateY(0) rotate(270deg); }
  100%{ transform:translateY(0) rotate(360deg); }
}
.gacha-machine .btn{ width:100%; }
.gacha-idle{ margin:0; color:var(--muted); padding-top:8px; }
.gacha-card{ display:grid; grid-template-columns:170px 1fr; gap:20px; align-items:start; }
.gacha-card h3{ margin:0 0 8px; font-size:1.5rem; line-height:1.3; }
.gacha-card h3:focus{ outline:none; }
.gacha-card p{ margin:12px 0 0; }
@media (max-width: 640px){
  .gacha{ grid-template-columns:1fr; }
  .gacha-card{ grid-template-columns:120px 1fr; gap:14px; }
}

/* ---------- 驛站路標 ---------- */
.post-list{ list-style:none; margin:0; padding:0; display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(300px,100%),1fr)); }
.post-link{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 14px;

.post-note{ grid-column:1; font-size:.8125rem; color:var(--muted); overflow-wrap:anywhere; }
.post-go{ grid-column:2; grid-row:1 / 3; font-size:.875rem; color:var(--accent); white-space:nowrap; }

         icon: [[9,2,2,17,'#6A4630'],[9,2,1,17,'#9A6E4A'],[8,1,4,1,'#B38A4C'],[3,4,7,3,'#81583A'],[2,5,1,1,'#81583A'],[11,8,7,3,'#4A3326'],[18,9,1,1,'#4A3326'],[3,12,7,3,'#E7D7B7'],[2,13,1,1,'#E7D7B7'],[5,5,3,1,'#F0BE75'],[13,9,2,1,'#5FC4B0'],[5,13,2,1,'#111613'],[7,18,6,2,'#827A6C']] },

  const ORDER = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

  /* ---------- 視窗管理（同時只會有一個） ---------- */
  const app = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const mTitle = document.getElementById('modal-title');
  const mSub = document.getElementById('modal-sub');
  const mBody = document.getElementById('modal-body');
  let opener = null;

  function openPanel(key, from) {
    const f = FAC[key];
    if (!f) return;
    if (overlay.hidden) opener = from || document.activeElement;
    modal.dataset.skin = f.skin;
    mTitle.textContent = f.title;
    mSub.textContent = f.name;
    overlay.hidden = false;
    document.body.classList.add('modal-open');
    app.inert = true;
    setView(f.render, null, true);
  }
  function closePanel() {
    if (overlay.hidden) return;
    overlay.hidden = true;
    mBody.replaceChildren();
    document.body.classList.remove('modal-open');
    app.inert = false;
    const back = opener;
    opener = null;
    if (back && document.contains(back) && typeof back.focus === 'function') back.focus({ preventScroll: true });
  }
  /* 在同一個視窗內切換畫面；focusSel 可指定切換後要聚焦的元素 */
  function setView(render, focusSel, isOpen) {
    mBody.replaceChildren();
    mBody.scrollTop = 0;
    render(mBody);
    requestAnimationFrame(() => {
      const target = (focusSel && mBody.querySelector(focusSel)) || (!isOpen && mBody.querySelector('[data-focus]')) || mTitle;
      target.focus({ preventScroll: !!focusSel });
      if (focusSel && target !== mTitle) target.scrollIntoView({ block: 'nearest' });
    });
  }
  function focusables() {
    return Array.from(modal.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'))
      .filter(n => n.getClientRects().length);
  }
  document.getElementById('modal-close').addEventListener('click', closePanel);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePanel(); });
  document.addEventListener('keydown', e => {
    if (overlay.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); return; }
    if (e.key !== 'Tab') return;
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], cur = document.activeElement;
    if (e.shiftKey && (cur === first || cur === mTitle || !modal.contains(cur))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (cur === last || !modal.contains(cur))) { e.preventDefault(); first.focus(); }
  });

    const floors = CAT_NAMES.map((c, i) => ({ code: NUM[i] || String(i + 1), cat: c })).concat([{ code: '全', cat: ALL }]);
    if (!floors.some(f => f.cat === lState.cat)) lState.cat = ALL;
    const code = el('span', { class: 'lift-floor', 'aria-hidden': 'true' });
    const name = el('span', { class: 'lift-name' });

      type: 'button', class: 'lift-btn', 'aria-pressed': String(f.cat === lState.cat),

  /* G｜命運抽取機：隨機推薦 */
  let lastPick = null;
  const CAP_COLORS = ['#713E49', '#496451', '#F0BE75', '#5FC4B0', '#B38A4C', '#A2646F'];
  function capsuleSvg() {
    const s = svg('svg', { viewBox: '0 0 24 24', 'shape-rendering': 'crispEdges', 'aria-hidden': 'true' });
    const bottom = svg('g', { fill: '#E7D7B7' });
    [[4,12,16,4],[6,16,12,2],[8,18,8,2]].forEach(([x,y,w,h]) => bottom.append(svg('rect', { x, y, width: w, height: h })));
    const top = svg('g', { class: 'cap-top' });
    const topOutline = svg('g', { fill: '#171E1B' });
    [[7,3,10,3],[5,5,14,3],[3,7,18,5]].forEach(([x,y,w,h]) => topOutline.append(svg('rect', { x, y, width: w, height: h })));
    const topFill = svg('g', { class: 'cap-color', fill: '#713E49' });
    [[8,4,8,2],[6,6,12,2],[4,8,16,4]].forEach(([x,y,w,h]) => topFill.append(svg('rect', { x, y, width: w, height: h })));
    top.append(topOutline, topFill, svg('rect', { x: 7, y: 7, width: 2, height: 2, fill: '#FFFFFF', opacity: .7 }), svg('rect', { x: 4, y: 11, width: 16, height: 1, fill: '#000', opacity: .25 }));
    const outline = svg('g', { fill: '#171E1B' });
    [[3,12,18,5],[5,12,14,7],[7,12,10,9]].forEach(([x,y,w,h]) => outline.append(svg('rect', { x, y, width: w, height: h })));
    s.append(outline, bottom, top);
    return s;
  }
  function renderGacha(body) {
    if (!DATA.works.length) { body.append(emptyState('命運抽取機裡還沒有膠囊。新增作品資料之後就能抽了。')); return; }
    const capsule = el('div', { class: 'capsule' }, capsuleSvg());
    const color = capsule.querySelector('.cap-color');
    const drawBtn = el('button', { type: 'button', class: 'btn btn-primary' }, '轉動旋鈕');
    const result = el('div', { class: 'gacha-result', 'aria-live': 'polite' },
      el('p', { class: 'gacha-idle' }, '轉動旋鈕，看看命運今天讓你遇見誰。'));

    function pick() {
      const pool = DATA.works.length > 1 ? DATA.works.filter(w => w.id !== lastPick) : DATA.works;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function show(w, moveFocus) {
      result.replaceChildren(el('article', { class: 'gacha-card' },
        coverEl(w, { eager: true }),
        el('div', null,
          el('h3', { tabindex: '-1' }, w.title),
          w.demo ? el('span', { class: 'demo-badge' }, '示範資料') : null,
          el('p', null, w.description || ''),
          el('div', { class: 'actions' }, linkEl(w.url),
            el('button', { type: 'button', class: 'btn', onclick: () => showDetail(w, () => setView(renderGacha)) }, '詳細資料')))));
      if (moveFocus) result.querySelector('h3').focus();
    }
    drawBtn.addEventListener('click', () => {
      if (drawBtn.disabled) return;
      const w = pick();
      lastPick = w.id;
      color.setAttribute('fill', CAP_COLORS[hash(w.id) % CAP_COLORS.length]);
      const finish = () => {
        capsule.classList.remove('rolling');
        capsule.classList.add('open');
        show(w, false);
        drawBtn.disabled = false;
        drawBtn.textContent = '再抽一次';
      };
      capsule.classList.remove('open', 'rolling');
      if (reduceMotion.matches) { finish(); return; }
      drawBtn.disabled = true;
      void capsule.offsetWidth;
      capsule.classList.add('rolling');
      setTimeout(finish, 520);
    });
    body.append(el('div', { class: 'gacha' },
      el('div', { class: 'gacha-machine' }, el('div', { class: 'capsule-stage' }, capsule), drawBtn), result));
    if (lastPick && worksById.has(lastPick)) {
      const w = worksById.get(lastPick);
      color.setAttribute('fill', CAP_COLORS[hash(w.id) % CAP_COLORS.length]);
      capsule.classList.add('open');
      drawBtn.textContent = '再抽一次';
      show(w, false);
    }
  }

  /* H｜驛站路標：通往其他驛站 */
  function renderLinks(body) {
    const links = DATA.links.filter(l => l && isHttps(l.url));
    if (!links.length) { body.append(emptyState('路標上還沒有刻任何驛站。在 SITE_DATA.links 加入連結後就會出現。')); return; }
    body.append(
      el('p', { class: 'intro' }, '旅店之外還有其他驛站。路標指向的地方都會在新分頁開啟。'),
      el('ul', { class: 'post-list' }, links.map(l => el('li', null,
        el('a', { class: 'post-link', href: l.url.trim(), target: '_blank', rel: 'noopener noreferrer', style: `--c:${/^#[0-9a-f]{3,8}$/i.test(l.color || '') ? l.color : 'var(--gold)'}` },
          el('span', { class: 'post-name' }, l.name || '未命名驛站'),
          el('span', { class: 'post-go', 'aria-hidden': 'true' }, '前往 →'),
          l.note ? el('span', { class: 'post-note' }, l.note) : null,
          el('span', { class: 'sr-only' }, '（在新分頁開啟）'))))));
  }

  /* ---------- 場景互動：事件委派 ---------- */
  const scene = document.getElementById('scene');
  const stage = document.getElementById('stage');
  const tip = document.getElementById('tip');

  function activate(h) {
    h.classList.remove('tap');
    void h.getBoundingClientRect();
    h.classList.add('tap');
    setTimeout(() => h.classList.remove('tap'), 420);
    hideTip();
    openPanel(h.dataset.panel, h);
  }
  function showTip(h) {
    const f = FAC[h.dataset.panel];
    if (!f) return;
    tip.replaceChildren(el('strong', null, f.name), el('span', null, f.title));
    const r = h.querySelector('.hit').getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + r.width / 2 - s.left, 80), s.width - 80);
    let y = r.top - s.top;
    const inside = y < 44;
    tip.classList.toggle('inside', inside);
    tip.style.left = `${x}px`;
    tip.style.top = `${inside ? Math.max(y, 0) : y}px`;
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); }

  scene.addEventListener('click', e => { const h = e.target.closest('.hot'); if (h) activate(h); });
  scene.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const h = e.target.closest('.hot');
    if (!h) return;
    e.preventDefault();
    activate(h);
  });
  scene.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const h = e.target.closest('.hot');
    if (h) showTip(h);
  });
  scene.addEventListener('pointerout', e => {
    const h = e.target.closest('.hot');
    if (h && !h.contains(e.relatedTarget)) hideTip();
  });
  scene.addEventListener('focusin', e => { const h = e.target.closest('.hot'); if (h) showTip(h); });
  scene.addEventListener('focusout', hideTip);

  document.getElementById('quick').addEventListener('click', e => openPanel('MENU', e.currentTarget));

  /* 旅店的貓：摸一下會抬頭說句話 */
  const cat = document.getElementById('cat');
  const bubble = document.getElementById('cat-bubble');
  const CAT_LINES = [
    '喵。',
    '呼嚕……呼嚕……',
    '……（翻個身，繼續睡）',
    '壁爐邊最暖，別跟我搶。',
    '書櫃第三層有好看的。喵。',
    '那扇門後面？我也沒去過。',
    '抽取機今天手氣不錯喔。',
    '新來的旅人？記得先去接待台登記。',
    '路標指的那些驛站，我都聞過味道。'
  ];
  let catLine = -1, catTimer = 0;
  function petCat() {
    let i;
    do { i = Math.floor(Math.random() * CAT_LINES.length); } while (CAT_LINES.length > 1 && i === catLine);
    catLine = i;
    bubble.textContent = CAT_LINES[i];
    bubble.classList.add('show');
    cat.classList.remove('poke');
    void cat.getBoundingClientRect();
    cat.classList.add('poke');
    clearTimeout(catTimer);
    catTimer = setTimeout(() => { bubble.classList.remove('show'); cat.classList.remove('poke'); }, 3200);
  }
  if (cat && bubble) {
    cat.addEventListener('click', petCat);
    cat.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); petCat(); } });
  }

  /* 網站文字 */
  if (DATA.site.title) {
    document.getElementById('site-title').textContent = DATA.site.title;
    document.title = DATA.site.subtitle ? `${DATA.site.title}｜${DATA.site.subtitle}` : DATA.site.title;
  }
  if (DATA.site.subtitle) document.getElementById('site-subtitle').textContent = DATA.site.subtitle;

  /* 手機：一開始把大廳捲到中間 */
  const scroller = document.getElementById('stage-scroll');
  requestAnimationFrame(() => {
    const extra = scroller.scrollWidth - scroller.clientWidth;
    if (extra > 0) scroller.scrollLeft = extra / 2;
  });
})();
</script>
</body>
</html>
