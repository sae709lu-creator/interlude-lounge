<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中繼休息大廳｜The Interlude Lounge</title>
<meta name="description" content="RP 角色與世界觀作品的互動展示入口。">
<style>
/* =========================================================
   設計代幣
   ========================================================= */
:root{
  --night:#161E2B; --wall:#293747; --floor:#504C4B;
  --gold:#D9AD70; --gold-hi:#F0CF98; --gold-lo:#A77F4C;
  --mist:#71998A; --mist-hi:#8FB6A6; --violet:#9B89D1; --violet-hi:#C5B8F0;
  --cream:#E9DDC5; --muted:#B3A893; --ink:#0E131B;
  --panel-2:#232D3E;
  --page:#1C2433; --page-edge:#141B27;
  --f-body:"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-title:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU","MingLiU",serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0F141D; --page-edge:#0A0E15; }
}
:root[data-theme="dark"]{ --page:#0F141D; --page-edge:#0A0E15; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%;
  background:var(--page);
  background-image:radial-gradient(ellipse at 50% 40%, transparent 40%, var(--page-edge) 100%);
  color:var(--cream); font-family:var(--f-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
body.modal-open{ overflow:hidden; }
.sr-only{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
button{ font:inherit; color:inherit; }

/* =========================================================
   頁首
   ========================================================= */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  max-width:1320px; margin:0 auto; padding:14px clamp(16px,3vw,32px) 12px;
}
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand svg{ width:32px; height:40px; flex:none; }
.brand h1{
  margin:0; font-family:var(--f-title); font-weight:700;
  font-size:clamp(1.25rem,2.2vw,1.625rem); line-height:1.2; letter-spacing:.12em; color:var(--cream);
}
.brand p{ margin:2px 0 0; font-size:.8125rem; color:var(--gold); letter-spacing:.04em; }

/* =========================================================
   像素按鈕
   ========================================================= */
.btn{
  --bd:var(--gold-lo);
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:8px 18px;
  background:var(--panel-2); color:var(--cream); border:0; cursor:pointer;
  font-size:.9375rem; line-height:1.3; text-decoration:none; white-space:nowrap;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  box-shadow:inset 0 0 0 2px var(--bd), inset 0 -6px 0 rgba(0,0,0,.28);
}
.btn:hover{ background:#2D394D; }
.btn:active{ box-shadow:inset 0 0 0 2px var(--bd), inset 0 4px 0 rgba(0,0,0,.28); }
.btn:focus-visible{ outline:none; box-shadow:inset 0 0 0 3px var(--violet-hi), inset 0 -6px 0 rgba(0,0,0,.28); }
.btn-primary{ background:var(--gold); color:#21170F; --bd:#F6DDB2; font-weight:700; }
.btn-primary:hover{ background:var(--gold-hi); }
.btn-primary[disabled]{ opacity:.6; cursor:progress; }
.btn-pending{ background:transparent; color:var(--muted); --bd:#4A5263; cursor:not-allowed; }
.btn-pending:hover{ background:transparent; }
.btn-ghost{ background:transparent; --bd:transparent; padding-left:10px; padding-right:12px; color:var(--gold-hi); }
.btn-ghost:hover{ background:rgba(255,255,255,.06); }
.btn-quick .btn-icon{ width:16px; height:16px; }

/* =========================================================
   大廳場景
   ========================================================= */
main{ padding:0 clamp(8px,2vw,24px) 20px; }
.stage-scroll{
  max-width:1320px; margin:0 auto; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:thin; scrollbar-color:#3A4558 transparent; overscroll-behavior-x:contain;
  padding:6px;
}
.stage{
  position:relative; margin:0 auto;
  width:min(100%, 1280px, calc((100svh - 150px) * 1.6));
  min-width:min(100%, 560px);
  aspect-ratio:960 / 600;
  background:var(--ink);
  box-shadow:0 0 0 4px var(--ink), 0 0 0 6px #3A4558, 0 0 0 10px var(--ink), 0 18px 40px rgba(0,0,0,.45);
}
.stage > svg{ display:block; width:100%; height:100%; }
.hint{
  max-width:1320px; margin:18px auto 0; text-align:center;
  font-size:.875rem; color:var(--muted); padding:0 16px;
}
.hint kbd{
  font-family:var(--f-body); font-size:.8125rem; padding:0 6px;
  background:var(--panel-2); color:var(--cream); box-shadow:inset 0 -2px 0 rgba(0,0,0,.4);
}

@media (max-width: 760px){
  .stage{ width:820px; min-width:820px; }
  .stage-scroll{ padding:6px 12px 10px; }
  .hint .desk-only{ display:none; }
}
@media (min-width: 761px){ .hint .touch-only{ display:none; } }

/* 互動物件 */
.hot{ cursor:pointer; outline:none; --hl:var(--gold-hi); }
.hot .hit{ pointer-events:all; }
.hot:hover .art{
  filter:drop-shadow(2px 0 0 var(--hl)) drop-shadow(-2px 0 0 var(--hl)) drop-shadow(0 2px 0 var(--hl)) drop-shadow(0 -2px 0 var(--hl));
}
.hot:focus-visible .art{
  --hl:var(--violet-hi);
  filter:drop-shadow(3px 0 0 var(--hl)) drop-shadow(-3px 0 0 var(--hl)) drop-shadow(0 3px 0 var(--hl)) drop-shadow(0 -3px 0 var(--hl)) brightness(1.1);
}
.hot.tap .art{ animation:tap .36s steps(2) 1; }
@keyframes tap{ 0%{ filter:brightness(1.7); } 100%{ filter:brightness(1); } }
.lights{ pointer-events:none; }
.cat{ pointer-events:none; }

/* 名稱提示 */
.tip{
  position:absolute; left:0; top:0; z-index:2; pointer-events:none;
  transform:translate(-50%, calc(-100% - 6px));
  display:flex; align-items:baseline; gap:8px;
  padding:6px 12px; background:var(--ink); color:var(--cream);
  font-size:.875rem; line-height:1.3; white-space:nowrap;
  box-shadow:0 0 0 2px var(--gold), 4px 4px 0 2px rgba(0,0,0,.4);
  opacity:0; transition:opacity .12s;
}
.tip.inside{ transform:translate(-50%, 8px); }
.tip.show{ opacity:1; }
.tip strong{ color:var(--gold-hi); font-weight:700; }
.tip span{ color:var(--muted); font-size:.8125rem; }

/* 場景微動態 */
.screen{ animation:flicker 7s steps(1) infinite; }
@keyframes flicker{ 0%,90%,100%{opacity:1} 91%{opacity:.72} 93%{opacity:1} 95%{opacity:.85} }
.cursor{ animation:blink 1.1s steps(1) infinite; }
@keyframes blink{ 0%,50%{opacity:1} 51%,100%{opacity:0} }
.lamp-glow{ animation:lamp 5s ease-in-out infinite alternate; }
@keyframes lamp{ from{opacity:.82} to{opacity:1} }
.seam-glow{ animation:seam 3.6s ease-in-out infinite alternate; }
@keyframes seam{ from{opacity:.65} to{opacity:1} }
.ind-on{ animation:ind 2.4s steps(1) infinite; }
@keyframes ind{ 0%,60%{opacity:1} 61%,100%{opacity:.45} }
.odd-btn, .led2{ animation:ind 3.2s steps(1) infinite; }
.steam{ animation:steam 2.6s steps(3) infinite; }
.steam.s2{ animation-delay:-1.3s; }
@keyframes steam{ 0%{transform:translateY(0);opacity:0} 40%{opacity:.35} 100%{transform:translateY(-6px);opacity:0} }
.cat-tail{ transform-box:fill-box; transform-origin:0% 100%; animation:tail 6s steps(1) infinite; }
@keyframes tail{ 0%,78%,100%{transform:rotate(0)} 80%{transform:rotate(-10deg)} 84%{transform:rotate(4deg)} 88%{transform:rotate(-7deg)} 92%{transform:rotate(0)} }

/* =========================================================
   視窗面板
   ========================================================= */
.overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top,0px)) 24px max(24px, env(safe-area-inset-bottom,0px));
  background:rgba(8,11,17,.72);
}
.overlay[hidden]{ display:none; }
.modal{
  --frame:#7A5236; --frame-hi:#D9AD70; --accent:#D9AD70; --bg:#1A2230; --row:#232D3E;
  position:relative; display:flex; flex-direction:column;
  width:min(940px, 100%); max-height:min(780px, 100%);
  padding:8px; background:var(--bg); color:var(--cream);
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
  box-shadow:inset 0 0 0 4px var(--frame), inset 0 0 0 6px var(--frame-hi), inset 0 0 0 8px var(--ink);
  animation:modal-in .16s steps(3) 1;
}
@keyframes modal-in{ from{ transform:scale(.97); opacity:.4; } to{ transform:none; opacity:1; } }
.modal[data-skin="wood"]  { --frame:#573A27; --frame-hi:#B5845A; --bg:#1E1915; --row:#2A221C; }
.modal[data-skin="paper"] { --frame:#6B4630; --frame-hi:#C09668; --bg:#231C17; --row:#2E251E; }
.modal[data-skin="lounge"]{ --frame:#476A5D; --frame-hi:#8FB6A6; --accent:#8FB6A6; --bg:#17221F; --row:#1F2D29; }
.modal[data-skin="screen"]{ --frame:#3D4250; --frame-hi:#71998A; --accent:#8FB6A6; --bg:#0C1A18; --row:#12241F; }
.modal[data-skin="lift"]  { --frame:#4A5568; --frame-hi:#9B89D1; --accent:#C5B8F0; --bg:#181A28; --row:#212436; }
.modal[data-skin="gacha"] { --frame:#82362F; --frame-hi:#D8746A; --accent:#F0A79C; --bg:#211718; --row:#2C1F20; }
.modal[data-skin="screen"] .modal-body{
  background-image:repeating-linear-gradient(0deg, rgba(113,153,138,.05) 0 2px, transparent 2px 4px);
}

.modal-head{
  display:flex; align-items:flex-start; gap:12px;
  padding:18px 14px 14px 22px;
  border-bottom:2px solid rgba(0,0,0,.35);
  box-shadow:0 2px 0 rgba(255,255,255,.04);
}
.modal-head-text{ min-width:0; padding-top:4px; }
.modal-head h2{
  margin:0; font-family:var(--f-title); font-weight:700;
  font-size:clamp(1.25rem, 2.4vw, 1.5rem); line-height:1.3; letter-spacing:.06em;
}
.modal-head h2:focus{ outline:none; }
.modal-head p{ margin:2px 0 0; font-size:.875rem; color:var(--accent); }
.modal-close{
  margin-left:auto; flex:none; width:44px; height:44px; padding:0;
  display:grid; place-items:center;
}
.modal-close svg{ width:14px; height:14px; }
.modal-body{
  flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  padding:20px 22px 28px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;
}
.modal-body h3{ font-family:var(--f-title); letter-spacing:.04em; }
.modal-body [data-focus]:focus{ outline:none; }

@media (max-width: 640px){
  .overlay{ padding:0; }
  .modal{
    width:100%; height:100%; max-height:none;
    clip-path:none; animation:none;
    padding-top:calc(8px + env(safe-area-inset-top,0px));
    padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  }
  .modal-head{ padding:12px 8px 12px 16px; position:sticky; top:0; }
  .modal-body{ padding:16px 16px 28px; }
}

/* ---------- 共用元件 ---------- */
.lead{ font-size:1.0625rem; max-width:38em; margin:0 0 20px; }
.section-title{ font-size:1.0625rem; margin:24px 0 10px; color:var(--accent); }
.status{ margin:12px 0 10px; font-size:.875rem; color:var(--muted); min-height:1.4em; }
.empty{
  grid-column:1 / -1;
  padding:32px 20px; text-align:center; color:var(--muted);
  border:2px dashed rgba(233,221,197,.18);
}
.empty p{ margin:0 0 14px; }
.empty p:last-child{ margin-bottom:0; }
.demo-badge{
  display:inline-block; font-size:.75rem; line-height:1.4; padding:1px 8px;
  background:rgba(217,173,112,.16); color:var(--gold-hi); box-shadow:inset 0 0 0 1px rgba(217,173,112,.45);
}
.actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }

.cover{ position:relative; aspect-ratio:3 / 4; background:#0F141C; overflow:hidden; }
.cover img, .cover svg, .cover video{ display:block; width:100%; height:100%; object-fit:cover; }
.cover .badges{ position:absolute; left:6px; top:6px; display:flex; gap:4px; }
.cover .badges .demo-badge{ background:rgba(14,19,27,.85); }
.cover .badges .badge-18{ background:rgba(110,38,33,.92); color:#FFE3DD; box-shadow:inset 0 0 0 1px rgba(216,116,106,.6); font-weight:700; }

/* ---------- 設施列表 ---------- */
.fac-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(min(260px,100%), 1fr)); }
.fac-btn{
  width:100%; display:grid; grid-template-columns:40px 1fr; gap:14px; align-items:center;
  min-height:60px; padding:10px 14px; text-align:left; cursor:pointer;
  background:var(--row); border:0; box-shadow:inset 4px 0 0 var(--c, var(--gold));
}
.fac-btn:hover{ background:rgba(255,255,255,.07); }
.fac-btn:focus-visible{ outline:3px solid var(--violet-hi); outline-offset:-3px; }
.fac-btn svg{ width:40px; height:40px; }
.fac-btn strong{ display:block; font-size:1rem; line-height:1.35; }
.fac-btn span{ display:block; font-size:.8125rem; color:var(--muted); line-height:1.4; }
.howto{ margin:0; padding-left:1.2em; max-width:40em; }
.howto li{ margin:4px 0; }
.howto li::marker{ color:var(--gold); }

/* ---------- 角色圖庫 ---------- */
.toolbar{ display:flex; flex-direction:column; gap:12px; }
.search{
  width:100%; min-height:44px; padding:10px 14px;
  font:inherit; color:var(--cream); background:#120F0C; border:0;
  box-shadow:inset 0 0 0 2px #4A3A2C, inset 0 3px 0 rgba(0,0,0,.4);
}
.search::placeholder{ color:#8C826F; }
.search:focus{ outline:none; box-shadow:inset 0 0 0 2px var(--gold), inset 0 3px 0 rgba(0,0,0,.4); }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  min-height:40px; padding:6px 14px; cursor:pointer; font-size:.875rem;
  background:var(--row); border:0; box-shadow:inset 0 0 0 2px rgba(181,132,90,.45);
}
.chip:hover{ background:rgba(255,255,255,.07); }
.chip[aria-pressed="true"]{ background:var(--gold); color:#21170F; box-shadow:inset 0 -3px 0 var(--gold-lo); font-weight:700; }
.chip:focus-visible{ outline:3px solid var(--violet-hi); outline-offset:1px; }
.grid{
  display:grid; gap:18px 16px;
  grid-template-columns:repeat(auto-fill, minmax(min(150px, calc(50% - 8px)), 1fr));
}
.card{
  display:flex; flex-direction:column; gap:4px; padding:0; text-align:left; cursor:pointer;
  background:none; border:0;
}
.card .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px #4A3A2C; margin-bottom:6px; }
.card:hover .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--gold); }
.card:focus-visible{ outline:none; }
.card:focus-visible .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 5px var(--violet-hi); }
.card-title{ font-weight:700; font-size:.9375rem; line-height:1.4; }
.card-meta{ font-size:.75rem; color:var(--muted); line-height:1.4; }

/* ---------- 作品詳細 ---------- */
.back{ margin:-6px 0 14px -6px; }
.detail{ display:grid; grid-template-columns:minmax(0, 260px) 1fr; gap:28px; align-items:start; }
.detail .cover{ box-shadow:0 0 0 2px var(--ink), 0 0 0 4px var(--frame-hi); }
.detail h3{ margin:0 0 8px; font-size:1.625rem; line-height:1.3; }
.detail .desc{ margin:14px 0 0; max-width:34em; }
.meta-dl{ display:grid; grid-template-columns:auto 1fr; gap:8px 18px; margin:20px 0 0; font-size:.9375rem; }
.meta-dl dt{ color:var(--muted); }
.meta-dl dd{ margin:0; }
.taglist{ display:flex; flex-wrap:wrap; gap:6px; list-style:none; margin:0; padding:0; }
.tag{ font-size:.8125rem; padding:1px 8px; background:rgba(255,255,255,.07); }
.tag-btn{ border:0; cursor:pointer; min-height:32px; padding:4px 10px; color:var(--cream); }
.tag-btn:hover{ background:rgba(217,173,112,.22); }
.tag-btn:focus-visible{ outline:2px solid var(--violet-hi); outline-offset:1px; }
.desc, .feature p, .gacha-card p, .term-detail .summary{ white-space:pre-line; }
.term-detail .summary.muted{ color:var(--muted); }
.feature-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
.feature-head .intro{ margin:0; }
@media (max-width: 640px){
  .detail{ grid-template-columns:1fr; gap:18px; }
  .detail .cover{ max-width:240px; }
}

/* ---------- 公告欄 ---------- */
.notes{ list-style:none; margin:0; padding:8px 4px 0; display:grid; gap:22px; grid-template-columns:repeat(auto-fill, minmax(min(260px,100%),1fr)); }
.note{
  position:relative; padding:18px 18px 16px;
  background:#E9DDC5; color:#2B2119; box-shadow:5px 5px 0 rgba(0,0,0,.35);
}
.note:nth-child(3n+2){ background:#DCE8DF; }
.note:nth-child(3n+3){ background:#E4DDF2; }
.note::before{
  content:""; position:absolute; top:-5px; left:calc(50% - 5px); width:10px; height:10px;
  background:#B5504A; box-shadow:0 0 0 2px #2B2119, 2px 2px 0 2px rgba(0,0,0,.25);
}
.note time{ font-size:.8125rem; font-weight:700; color:#7A5236; }
.note h3{ margin:4px 0 6px; font-size:1.125rem; line-height:1.35; color:#21170F; }
.note p{ margin:0; font-size:.9375rem; }
.note-link{
  display:inline-flex; align-items:center; min-height:44px; margin-top:8px; padding:0;
  background:none; border:0; cursor:pointer; color:#6B3F50; font-weight:700; text-decoration:underline; text-underline-offset:3px;
}
.note-link:focus-visible{ outline:3px solid #6D5EA3; outline-offset:2px; }

/* ---------- 精選推薦 ---------- */
.intro{ margin:0 0 18px; color:var(--muted); }
.features{ display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(380px,100%),1fr)); }
.feature{
  display:grid; grid-template-columns:104px 1fr; gap:16px; padding:14px;
  background:var(--row); box-shadow:inset 0 0 0 2px rgba(143,182,166,.22);
}
.feature .cover{ box-shadow:0 0 0 2px var(--ink); }
.feature h3{ margin:0 0 6px; font-size:1.125rem; line-height:1.35; }
.feature p{ margin:0; font-size:.9375rem; }
.feature .actions{ margin-top:12px; }

/* ---------- 終端機 ---------- */
.term-path{ margin:0 0 14px; font-family:var(--f-mono); font-size:.8125rem; color:var(--mist); }
.term-path::before{ content:"> "; color:var(--violet-hi); }
.term{ display:grid; grid-template-columns:250px 1fr; gap:20px; align-items:start; }
.term-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
.term-item{
  width:100%; display:flex; justify-content:space-between; align-items:center; gap:12px;
  min-height:48px; padding:10px 14px; text-align:left; cursor:pointer;
  background:transparent; border:0;
}
.term-item:hover{ background:rgba(113,153,138,.1); }
.term-item[aria-current="true"]{ background:rgba(113,153,138,.2); box-shadow:inset 4px 0 0 var(--mist); }
.term-item:focus-visible{ outline:3px solid var(--violet-hi); outline-offset:-3px; }
.term-name{ font-weight:700; }
.term-count{ font-size:.8125rem; color:var(--mist-hi); white-space:nowrap; }
.term-detail{ padding:18px 20px; background:rgba(0,0,0,.25); box-shadow:inset 0 0 0 2px #23403A; min-width:0; }
.term-detail h3{ margin:0; font-size:1.375rem; }
.term-detail .tagline{ margin:4px 0 12px; color:var(--mist-hi); }
.term-detail .summary{ margin:0; max-width:36em; }
.term-stat{ margin:14px 0 0; font-family:var(--f-mono); font-size:.8125rem; color:var(--mist); }
@media (max-width: 640px){ .term{ grid-template-columns:1fr; } }

.work-list{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
.work-row{
  width:100%; display:grid; grid-template-columns:48px 1fr auto; gap:14px; align-items:center;
  min-height:44px; padding:8px 12px 8px 8px; text-align:left; cursor:pointer;
  background:rgba(255,255,255,.035); border:0;
}
.work-row:hover{ background:rgba(255,255,255,.08); }
.work-row:focus-visible{ outline:3px solid var(--violet-hi); outline-offset:-3px; }
.work-row .cover{ width:48px; }
.work-row .cover .badges{ display:none; }
.work-row strong{ display:block; font-size:.9375rem; line-height:1.4; }
.work-row small{ display:block; font-size:.75rem; color:var(--muted); line-height:1.4; }
.work-row .go{ font-size:.8125rem; color:var(--accent); }

/* ---------- 電梯 ---------- */
.lift-display{
  display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:12px 18px;
  background:#0B0C14; box-shadow:inset 0 0 0 2px #2D2A48;
}
.lift-floor{
  min-width:2.6em; font-family:var(--f-mono); font-size:1.75rem; font-weight:700; line-height:1;
  color:var(--violet-hi); text-shadow:0 0 8px rgba(155,137,209,.65);
}
.lift-name{ font-size:1.0625rem; }
.lift-buttons{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(min(190px,100%),1fr)); }
.lift-btn{
  display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 14px 8px 8px; cursor:pointer; text-align:left;
  background:var(--row); border:0; box-shadow:inset 0 0 0 2px #3B3F55;
}
.lift-btn:hover{ background:#2A2D42; }
.lift-btn:focus-visible{ outline:3px solid var(--violet-hi); outline-offset:-3px; }
.lift-btn .num{
  display:grid; place-items:center; flex:none; width:38px; height:38px;
  background:#3B3F55; font-size:.8125rem; font-weight:700;
  clip-path:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px));
}
.lift-btn[aria-pressed="true"] .num{ background:var(--violet); color:#141225; }
.lift-btn[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px var(--violet); }
.lift-btn .cnt{ margin-left:auto; font-size:.8125rem; color:var(--muted); }
.lift-results{ margin-top:22px; }

/* ---------- 扭蛋機 ---------- */
.gacha{ display:grid; grid-template-columns:210px 1fr; gap:28px; align-items:start; }
.gacha-machine{ display:flex; flex-direction:column; align-items:center; gap:16px; }
.capsule-stage{
  width:180px; height:180px; display:grid; place-items:center;
  background:#140F10; box-shadow:inset 0 0 0 2px #4A2622, inset 0 -24px 0 rgba(255,255,255,.03);
}
.capsule svg{ display:block; width:104px; height:104px; overflow:visible; }
.capsule .cap-top{ transform-box:fill-box; transform-origin:0% 100%; transition:transform .24s steps(3); }
.capsule.open .cap-top{ transform:translate(-2px,-4px) rotate(-16deg); }
.capsule.rolling{ animation:roll .5s steps(4) 1; }
@keyframes roll{
  0%{ transform:translateY(-28px) rotate(0deg); }
  25%{ transform:translateY(0) rotate(90deg); }
  50%{ transform:translateY(-10px) rotate(180deg); }
  75%{ transform:translateY(0) rotate(270deg); }
  100%{ transform:translateY(0) rotate(360deg); }
}
.gacha-machine .btn{ width:100%; }
.gacha-idle{ margin:0; color:var(--muted); padding-top:8px; }
.gacha-card{ display:grid; grid-template-columns:170px 1fr; gap:20px; align-items:start; }
.gacha-card h3{ margin:0 0 8px; font-size:1.5rem; line-height:1.3; }
.gacha-card h3:focus{ outline:none; }
.gacha-card p{ margin:12px 0 0; }
@media (max-width: 640px){
  .gacha{ grid-template-columns:1fr; }
  .gacha-card{ grid-template-columns:120px 1fr; gap:14px; }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none!important; transition:none!important; }
}

    function draw() {
      const wd = worldsById.get(tState.world);
      const list = DATA.works.filter(w => w.worldId === wd.id);
      path.textContent = `lounge/worlds/${wd.id}`;
      detail.replaceChildren(...[
        el('h3', null, wd.name),
        wd.tagline ? el('p', { class: 'tagline' }, wd.tagline) : null,
        el('p', { class: 'summary' + (wd.summary ? '' : ' muted') }, wd.summary || '這個世界觀的介紹還沒寫。'),
        el('p', { class: 'term-stat' }, `收錄角色：${list.length}`),
        list.length ? workRows(list, w => showDetail(w, () => setView(renderTerminal, byId(w.id))))
                    : el('div', { style: 'margin-top:12px' }, emptyState('這個世界還沒有角色入住。'))].filter(Boolean));
    }
    body.append(path, el('div', { class: 'term' },
      el('nav', { 'aria-label': '世界觀列表' }, el('ul', { class: 'term-list' }, btns.map(b => el('li', null, b)))), detail));
    draw();
  }

  /* F｜電梯：作品分類 */
  const lState = { cat: ALL };
  function renderElevator(body) {
    const floors = CAT_NAMES.map((c, i) => ({ code: `${i + 1}F`, cat: c })).concat([{ code: '全', cat: ALL }]);
    if (!floors.some(f => f.cat === lState.cat)) lState.cat = ALL;
    const code = el('span', { class: 'lift-floor', 'aria-hidden': 'true' });
    const name = el('span', { class: 'lift-name' });
    const results = el('div', { class: 'lift-results' });
    const btns = floors.map(f => el('button', {
      type: 'button', class: 'lift-btn', 'aria-pressed': String(f.cat === lState.cat),
      onclick: e => { lState.cat = f.cat; btns.forEach(b => b.setAttribute('aria-pressed', String(b === e.currentTarget))); draw(); }
    }, el('span', { class: 'num', 'aria-hidden': 'true' }, f.code), el('span', null, f.cat), el('span', { class: 'cnt' }, `${worksIn(f.cat).length} 件`)));

    function draw() {
      const f = floors.find(x => x.cat === lState.cat);
      code.textContent = f.code;
      name.textContent = `目前樓層：${f.cat}`;
      const list = worksIn(f.cat);
      results.replaceChildren(list.length
        ? workRows(list, w => showDetail(w, () => setView(renderElevator, byId(w.id))))
        : emptyState('這一層目前沒有作品。'));
    }
    body.append(el('div', { class: 'lift-display', 'aria-live': 'polite' }, code, name),
      el('div', { class: 'lift-buttons', role: 'group', 'aria-label': '選擇樓層' }, btns), results);
    draw();
  }

  /* G｜扭蛋機：隨機推薦 */
  let lastPick = null;
  const CAP_COLORS = ['#D8746A', '#71998A', '#D9AD70', '#9B89D1', '#6AA0D8', '#E88AA8'];
  function capsuleSvg() {
    const s = svg('svg', { viewBox: '0 0 24 24', 'shape-rendering': 'crispEdges', 'aria-hidden': 'true' });
    const bottom = svg('g', { fill: '#E9DDC5' });
    [[4,12,16,4],[6,16,12,2],[8,18,8,2]].forEach(([x,y,w,h]) => bottom.append(svg('rect', { x, y, width: w, height: h })));
    const top = svg('g', { class: 'cap-top' });
    const topOutline = svg('g', { fill: '#1A1D24' });
    [[7,3,10,3],[5,5,14,3],[3,7,18,5]].forEach(([x,y,w,h]) => topOutline.append(svg('rect', { x, y, width: w, height: h })));
    const topFill = svg('g', { class: 'cap-color', fill: '#D8746A' });
    [[8,4,8,2],[6,6,12,2],[4,8,16,4]].forEach(([x,y,w,h]) => topFill.append(svg('rect', { x, y, width: w, height: h })));
    top.append(topOutline, topFill, svg('rect', { x: 7, y: 7, width: 2, height: 2, fill: '#FFFFFF', opacity: .7 }), svg('rect', { x: 4, y: 11, width: 16, height: 1, fill: '#000', opacity: .25 }));
    const outline = svg('g', { fill: '#1A1D24' });
    [[3,12,18,5],[5,12,14,7],[7,12,10,9]].forEach(([x,y,w,h]) => outline.append(svg('rect', { x, y, width: w, height: h })));
    s.append(outline, bottom, top);
    return s;
  }
  function renderGacha(body) {
    if (!DATA.works.length) { body.append(emptyState('扭蛋機裡還沒有扭蛋。新增作品資料之後就能抽了。')); return; }
    const capsule = el('div', { class: 'capsule' }, capsuleSvg());
    const color = capsule.querySelector('.cap-color');
    const drawBtn = el('button', { type: 'button', class: 'btn btn-primary' }, '抽取角色');
    const result = el('div', { class: 'gacha-result', 'aria-live': 'polite' },
      el('p', { class: 'gacha-idle' }, '轉一下把手，看看今天遇到誰。'));

    function pick() {
      const pool = DATA.works.length > 1 ? DATA.works.filter(w => w.id !== lastPick) : DATA.works;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function show(w, moveFocus) {
      result.replaceChildren(el('article', { class: 'gacha-card' },
        coverEl(w, { eager: true }),
        el('div', null,
          el('h3', { tabindex: '-1' }, w.title),
          w.demo ? el('span', { class: 'demo-badge' }, '示範資料') : null,
          el('p', null, w.description || ''),
          el('div', { class: 'actions' }, linkEl(w.url),
            el('button', { type: 'button', class: 'btn', onclick: () => showDetail(w, () => setView(renderGacha)) }, '詳細資料')))));
      if (moveFocus) result.querySelector('h3').focus();
    }
    drawBtn.addEventListener('click', () => {
      if (drawBtn.disabled) return;
      const w = pick();
      lastPick = w.id;
      color.setAttribute('fill', CAP_COLORS[hash(w.id) % CAP_COLORS.length]);
      const finish = () => {
        capsule.classList.remove('rolling');
        capsule.classList.add('open');
        show(w, false);
        drawBtn.disabled = false;
        drawBtn.textContent = '再抽一次';
      };
      capsule.classList.remove('open', 'rolling');
      if (reduceMotion.matches) { finish(); return; }
      drawBtn.disabled = true;
      void capsule.offsetWidth;
      capsule.classList.add('rolling');
      setTimeout(finish, 520);
    });
    body.append(el('div', { class: 'gacha' },
      el('div', { class: 'gacha-machine' }, el('div', { class: 'capsule-stage' }, capsule), drawBtn), result));
    if (lastPick && worksById.has(lastPick)) {
      const w = worksById.get(lastPick);
      color.setAttribute('fill', CAP_COLORS[hash(w.id) % CAP_COLORS.length]);
      capsule.classList.add('open');
      drawBtn.textContent = '再抽一次';
      show(w, false);
    }
  }

  /* ---------- 場景互動：事件委派 ---------- */
  const scene = document.getElementById('scene');
  const stage = document.getElementById('stage');
  const tip = document.getElementById('tip');

  function activate(h) {
    h.classList.remove('tap');
    void h.getBoundingClientRect();
    h.classList.add('tap');
    setTimeout(() => h.classList.remove('tap'), 420);
    hideTip();
    openPanel(h.dataset.panel, h);
  }
  function showTip(h) {
    const f = FAC[h.dataset.panel];
    if (!f) return;
    tip.replaceChildren(el('strong', null, f.name), el('span', null, f.title));
    const r = h.querySelector('.hit').getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    const x = Math.min(Math.max(r.left + r.width / 2 - s.left, 80), s.width - 80);
    let y = r.top - s.top;
    const inside = y < 44;
    tip.classList.toggle('inside', inside);
    tip.style.left = `${x}px`;
    tip.style.top = `${inside ? Math.max(y, 0) : y}px`;
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); }

  scene.addEventListener('click', e => { const h = e.target.closest('.hot'); if (h) activate(h); });
  scene.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const h = e.target.closest('.hot');
    if (!h) return;
    e.preventDefault();
    activate(h);
  });
  scene.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const h = e.target.closest('.hot');
    if (h) showTip(h);
  });
  scene.addEventListener('pointerout', e => {
    const h = e.target.closest('.hot');
    if (h && !h.contains(e.relatedTarget)) hideTip();
  });
  scene.addEventListener('focusin', e => { const h = e.target.closest('.hot'); if (h) showTip(h); });
  scene.addEventListener('focusout', hideTip);

  document.getElementById('quick').addEventListener('click', e => openPanel('MENU', e.currentTarget));

  /* 網站文字 */
  if (DATA.site.title) {
    document.getElementById('site-title').textContent = DATA.site.title;
    document.title = DATA.site.subtitle ? `${DATA.site.title}｜${DATA.site.subtitle}` : DATA.site.title;
  }
  if (DATA.site.subtitle) document.getElementById('site-subtitle').textContent = DATA.site.subtitle;

  /* 手機：一開始把大廳捲到中間 */
  const scroller = document.getElementById('stage-scroll');
  requestAnimationFrame(() => {
    const extra = scroller.scrollWidth - scroller.clientWidth;
    if (extra > 0) scroller.scrollLeft = extra / 2;
  });
})();
</script>
</body>
</html>
